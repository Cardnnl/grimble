<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>GRIMBLE</title>
    <meta name="description" content="GRIMBLE: a PS1-style co-op goblin horde brawler. Play in your browser, solo or online with up to 4 friends.">
    <link rel="icon" type="image/png" href="TemplateData/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="game" tabindex="-1"></canvas>
      <div id="loading">
        <img id="logo" src="TemplateData/logo.png" alt="GRIMBLE">
        <div id="bar"><div id="fill"></div></div>
        <div id="status">LOADING...</div>
      </div>
      <div id="warning"></div>
    </div>
    <div id="footer">
      <img src="TemplateData/icon.png" alt="">
      <span class="title">GRIMBLE</span>
      <span class="ver">v0.9.0</span>
      <span class="hint">KEYBOARD &amp; MOUSE OR A CONTROLLER &middot; ONLINE PLAY IS WITH OTHER BROWSER PLAYERS</span>
      <button id="fullscreen" title="Fullscreen">FULLSCREEN</button>
    </div>
    <script>
      var canvas = document.querySelector("#game");

      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type == "error" ? "error" : "note";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/GRIMBLE_0.9.0_Demo_Web.data.unityweb",
        frameworkUrl: buildUrl + "/GRIMBLE_0.9.0_Demo_Web.framework.js.unityweb",
        codeUrl: buildUrl + "/GRIMBLE_0.9.0_Demo_Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "CARDNL",
        productName: "GRIMBLE",
        productVersion: "0.9.0",
        showBanner: showBanner,
        // Saves (progress, settings, cosmetics) live in the browser's storage and stay there between visits.
        autoSyncPersistentDataPath: true,
        // Chunky PS1 pixels anyway: render at CSS pixels, not the screen's (much faster on high-DPI screens).
        devicePixelRatio: 1,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/GRIMBLE_0.9.0_Demo_Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
          document.querySelector("#status").textContent = progress < 0.9 ? "LOADING... " + Math.round(100 * progress) + "%" : "WAKING THE GOBLINS...";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          document.querySelector("#fullscreen").onclick = function () { instance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
      // Keys like space and the arrows shouldn't scroll the page while playing.
      window.addEventListener("keydown", function (e) {
        if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0 && document.activeElement == canvas) e.preventDefault();
      });
      canvas.addEventListener("mousedown", function () { canvas.focus(); });
    </script>
  </body>
</html>
